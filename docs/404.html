<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webly – Page not found</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: grid; place-items: center; font-family: 'Poppins', system-ui, sans-serif; color: #fff;
               background: linear-gradient(135deg, #000, rgb(56, 4, 105), #7536db, rgb(193, 107, 233)); }
        main { text-align: center; padding: 40px 48px; border-radius: 20px; background: rgba(255, 255, 255, 0.1);
               border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
               -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        h1 { margin: 0; font-size: 4.5rem; background: linear-gradient(90deg, #00d0ff, #df2fff, #ff9900);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
        p { margin: 8px 0 24px; color: rgba(255, 255, 255, 0.8); }
        a { display: inline-block; padding: 10px 24px; border-radius: 30px; background: #fff; color: #111; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>That page doesn't exist.</p>
        <a href="./" id="home">Back to Webly</a>
    </main>
    <script>
        // Project sites live under /<repo>/; send "home" to that base rather than the user-site root
        var base = location.pathname.split('/')[1] === '.Webly' ? '/.Webly/' : '/';
        document.getElementById('home').href = base;
    </script>
</body>
</html>
